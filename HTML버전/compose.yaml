services:
  videosaver:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${APP_PORT:-8766}:8766"
    environment:
      PUBLIC_MODE: "${PUBLIC_MODE:-1}"
      APP_PASSWORD: "${APP_PASSWORD:-}"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://localhost:8766}"
      VIDEO_DATA_DIR: /data
      VIDEO_TTL_SECONDS: "3600"
      VIDEO_SESSION_TTL_SECONDS: "7200"
    volumes:
      - video-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
volumes:
  video-data:
