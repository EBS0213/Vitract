services:
  videosaver:
    environment:
      PUBLIC_ORIGIN: "https://${DOMAIN:?Set DOMAIN to your actual domain}"
      VIDEO_TRUSTED_PROXIES: "172.30.86.2/32"
    networks:
      clipsave-proxy:
        ipv4_address: 172.30.86.3
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN:?Set DOMAIN to your actual domain}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      videosaver:
        condition: service_healthy
    networks:
      clipsave-proxy:
        ipv4_address: 172.30.86.2
networks:
  clipsave-proxy:
    ipam:
      config:
        - subnet: 172.30.86.0/24
volumes:
  caddy-data:
  caddy-config:
